name: verify
on: [push, pull_request]
jobs:
 test:
  runs-on: ubuntu-latest
  services:
   mysql:
    image: mysql:8.4
    env:
     MYSQL_ROOT_PASSWORD: test
     MYSQL_DATABASE: oficina_test
    ports: ["3306:3306"]
    options: --health-cmd="mysqladmin ping -ptest" --health-interval=5s --health-timeout=5s --health-retries=30
  env:
   DATABASE_URL: mysql://root:test@127.0.0.1:3306/oficina_test
   TEST_DATABASE_URL: mysql://root:test@127.0.0.1:3306/oficina_test
   JWT_SECRET: ci-jwt-secret-longer-than-32-characters
   WEBHOOK_SECRET: ci-webhook-secret-longer-than-32-characters
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 22
      cache: npm
   - run: npm ci
   - run: npm run db:generate
   - run: npm run db:migrate
   - run: npm run build
   - run: npm run check -w mobile
   - run: npm test